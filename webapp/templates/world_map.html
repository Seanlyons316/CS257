<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="world_map.css" type="text/css" />
    <title>Map</title>
</head>
<body>
  <div class="main_wrapper">
    <h1 class="title_center">SEARCH BY MAP</h1>
    <div class="container">
      <div class="map-container">
        <img src="images/map.png" alt="Map of the area" />
        <div class="map-overlay">
          <div class="marker" style="top: 100px; left: 100px;"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="left-panel">  
    <h2>Filter Tsunamis</h2>
    <form action="/search" method="get">
        <label for="year">Year:</label>
        <input type="number" id="year" name="year" placeholder="e.g., 2004" />
        <label for="Casualties">Casualties:</label>
        <input type="number" id="casualties" name="casualties" placeholder="e.g., 1000" />

        <input type="submit" value="Filter" />
    </form>
    <h2 style="margin-top: 30px;">Marker Parameters</h2>
    <form id="marker-params-form">
        <label for="marker-radius">Marker Radius (km):</label>
        <input type="number" id="marker-radius" name="radius" placeholder="e.g., 100" min="0" />
        <label for="Max Tsunamis Retrieved">Max Tsunamis Retrieved:</label>
        <input type="number" id="max-tsunamis" name="max-tsunamis" placeholder="e.g., 10" min="1" />
        <input type="submit" value="Update Marker" />
    </form>
    </div>
    </form>

</div>

</body>
